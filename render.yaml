services:
  - type: web
    name: gridbricks-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_MODE
        value: live
      - key: ANALYSIS_START
        value: "2026-01-01"
      - key: ANALYSIS_END
        value: "2026-01-31"
      - key: DECISION_CUTOFF_TIME
        value: "09:30"
      - key: DECISION_CUTOFF_TZ
        value: Europe/London
      - key: DECISION_CUTOFF_INCLUSIVE
        value: "true"
      - key: CACHE_TTL_SECONDS
        value: "604800"
      - key: ALLOWED_ORIGINS
        sync: false
